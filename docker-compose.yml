services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marsshare
      POSTGRES_USER: marsshare
      POSTGRES_PASSWORD: marsshare
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marsshare -d marsshare"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://marsshare:marsshare@postgres:5432/marsshare?sslmode=disable}
      APP_MASTER_KEY: ${APP_MASTER_KEY:-change-me-to-a-32-byte-secret!!!}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      API_ADDR: ${API_ADDR:-:8080}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/data/storage}
      WORKER_INTERVAL: ${WORKER_INTERVAL:-30s}
    ports:
      - "8080:8080"
    volumes:
      - ./api:/app
      - ./data/storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    command: ["go", "run", "./cmd/api"]

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://marsshare:marsshare@postgres:5432/marsshare?sslmode=disable}
      APP_MASTER_KEY: ${APP_MASTER_KEY:-change-me-to-a-32-byte-secret!!!}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/data/storage}
      WORKER_INTERVAL: ${WORKER_INTERVAL:-30s}
    volumes:
      - ./api:/app
      - ./data/storage:/data/storage
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["go", "run", "./cmd/worker"]

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: http://api:8080
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

  mailpit:
    image: axllent/mailpit:latest
    profiles: ["dev"]
    ports:
      - "8025:8025"
      - "1025:1025"
