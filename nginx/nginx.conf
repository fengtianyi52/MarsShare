# MarsShare production gateway
#
# This file is dropped into /etc/nginx/conf.d/default.conf so it inherits
# the worker / events / mime defaults from the upstream nginx image. We
# only need to declare the upstream and a single virtual server.

upstream marsshare_api {
    # Resolved by Docker's embedded DNS — must match the service name in
    # docker-compose.prod.yml.
    server api:8080;
    keepalive 32;
}

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Body limits & timeouts ──────────────────────────────────
    # MarsShare lets users upload multi-GB files. The API still
    # enforces its own per-user upload_limit_bytes, but nginx must
    # accept at least the largest expected file or the request gets
    # truncated before the API ever sees it.
    client_max_body_size  5g;
    client_body_buffer_size 1m;
    client_body_timeout   600s;

    # ── Compression ─────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # ── Security headers (defaults — TLS termination adds HSTS) ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Shared proxy settings (used by every proxy_pass below) ──
    # Defined as variables so we can keep each `location` block tidy.
    proxy_http_version  1.1;
    proxy_set_header    Host              $host;
    proxy_set_header    X-Real-IP         $remote_addr;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_set_header    X-Forwarded-Host  $host;
    proxy_set_header    Connection        "";
    # SSE / streaming friendly: don't buffer responses end-to-end so
    # long-poll style endpoints can drip data back to the client, and
    # don't buffer the request body so multi-GB uploads stream straight
    # through to the API instead of being staged on disk first.
    proxy_buffering           off;
    proxy_request_buffering   off;
    proxy_read_timeout        600s;
    proxy_send_timeout        600s;
    proxy_connect_timeout     30s;

    # ── API reverse proxy ───────────────────────────────────────
    location /api/ {
        proxy_pass http://marsshare_api;
    }

    # External health check passthrough so monitors can probe the API.
    location = /healthz {
        proxy_pass http://marsshare_api;
        access_log off;
    }

    # ── Static asset caching ────────────────────────────────────
    # Vite emits content-hashed filenames in /assets/, so they're safe
    # to mark as immutable. index.html stays uncached so the next deploy
    # is picked up on the next page load.
    location ^~ /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files  $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Common static file extensions outside /assets/ (favicons, robots…).
    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|otf|map)$ {
        expires    30d;
        add_header Cache-Control "public" always;
        access_log off;
        try_files  $uri =404;
    }

    # ── SPA fallback ────────────────────────────────────────────
    # Everything that isn't a real file falls through to index.html so
    # React Router handles the route on the client.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
